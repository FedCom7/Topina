name: Deploy Data to Firebase

# DISATTIVATO sull'automatico: su Firebase scrive solo lo script Python
# esterno (NFL_Fantasy_Dash), che e' il produttore ufficiale dei dati di lega.
#
# Con il trigger `push` attivo, committare un file sotto data/ ricaricava quel
# JSON su Firebase e poteva sovrascrivere quanto appena caricato dallo script:
# due scrittori sugli stessi nodi, vince l'ultimo.
#
# Resta l'avvio manuale (Actions -> Run workflow), utile per ricaricare gli
# storici 2019-2025 se dovessero servire.
on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'data/**'
  #     - 'scripts/upload-data.js'
  workflow_dispatch:

jobs:
  deploy-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Upload Data to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/upload-data.js
