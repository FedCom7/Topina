name: Build nflverse features + draft model

# Rigenera i JSON feature nflverse e il modello draft, poi li committa.
# Così le Draft Grades / SOS+ si aggiornano da sole: nessun run locale.
# I dati nflverse sono pubblici (nessun secret). La cache grezza .nflverse-cache/
# resta effimera nel runner (gitignored).
#
# NON SCRIVE SU FIREBASE, e non deve mai farlo: qui si fanno solo commit di
# file nel repo. Su Firebase scrive un produttore solo (vedi CLAUDE.md). Il
# commit giornaliero qui sotto è innocuo proprio perché deploy-data.yml ha il
# trigger `push` disattivato: se qualcuno lo riattivasse, ogni giro di questa
# Action ricaricherebbe i JSON su Firebase sovrascrivendo il produttore vero.
#
# Due cadenze:
#   - GIORNALIERA (leggera): infortuni, IR, punti, inactive. Sono le uniche
#     cose che cambiano in settimana. Serve soprattutto al sabato, perché la
#     designazione ufficiale (Out/Questionable) esce il VENERDÌ: con il solo
#     giro del martedì il sito l'avrebbe vista a partite già giocate.
#     nflverse rigenera i suoi file ogni mattina verso le 07:40 UTC, quindi
#     alle 09:00 UTC troviamo sempre roba fresca.
#   - MARTEDÌ (completa): aggiunge modello draft, ADP, combine, trade, feature.
#     Roba che si muove a stagione o dopo il draft, non in settimana. Il
#     martedì è dopo il Monday Night, quindi la giornata è chiusa e definitiva.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Stagioni da rigenerare (es. '2025 2024'); vuoto = ultime due"
        required: false
        default: ''
  # Trigger da API esterna: il produttore NFL_Fantasy_Dash, subito dopo aver
  # scritto draft_data su Firebase, può innescare il refresh dei dati mostrati
  # nelle Draft Grades con:
  #   POST /repos/{owner}/{repo}/dispatches  {"event_type":"draft-uploaded"}
  # (il draft si calcola comunque client-side; questo aggiorna SOS+/TSI/bust%).
  repository_dispatch:
    types: [draft-uploaded, refresh-draft-data]
  push:
    branches: [main]
    paths:
      - 'data/draft/**'          # nuovo draft caricato nel repo → aggiorna le feature
  schedule:
    - cron: '0 9 * * 2'                 # martedì: giro completo (dopo il Monday Night)
    - cron: '0 9 * * 0,1,3,4,5,6'       # gli altri giorni: solo la parte che cambia

permissions:
  contents: write

concurrency:
  group: build-nflverse
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Serve a due passaggi in Python: l'esito della domenica (build_inactives)
      # e il filtro che scarta i file cambiati solo nel timestamp.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determina le stagioni
        id: yrs
        run: |
          if [ -n "${{ github.event.inputs.seasons }}" ]; then
            echo "seasons=${{ github.event.inputs.seasons }}" >> "$GITHUB_OUTPUT"
          else
            Y=$(date +%Y)
            echo "seasons=$Y $((Y-1))" >> "$GITHUB_OUTPUT"
          fi

      # `leggero` = è il giro giornaliero. I passaggi pesanti lo saltano: non
      # cambierebbero comunque da un giorno all'altro, e rifarli ogni mattina
      # vorrebbe dire riscaricare decine di MB da nflverse per niente.
      - name: Che giro è
        id: giro
        run: |
          if [ "${{ github.event.schedule }}" = "0 9 * * 0,1,3,4,5,6" ]; then
            echo "leggero=1" >> "$GITHUB_OUTPUT"
          else
            echo "leggero=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Genera feature nflverse
        if: steps.giro.outputs.leggero != '1'
        run: node scripts/build-nflverse-features.mjs ${{ steps.yrs.outputs.seasons }}

      - name: Riallena il modello draft
        if: steps.giro.outputs.leggero != '1'
        run: node scripts/build-draft-model.mjs

      - name: Genera ADP con dispersione (Fantasy Football Calculator)
        if: steps.giro.outputs.leggero != '1'
        run: node scripts/build-adp-ffc.mjs
        continue-on-error: true   # fonte esterna: se giù, resta l'ADP Sleeper (graceful)

      - name: Cause di performance (perché ha reso così)
        if: steps.giro.outputs.leggero != '1'
        run: node scripts/build-perf-causes.mjs

      # --- da qui in giù gira anche nel giro giornaliero: è la roba che
      #     cambia davvero durante la settimana ---

      - name: Genera rosa completa squadre NFL
        run: node scripts/build-nfl-roster.mjs ${{ steps.yrs.outputs.seasons }}

      - name: Genera report infortuni squadre NFL
        run: node scripts/build-nfl-injuries.mjs ${{ steps.yrs.outputs.seasons }}

      - name: Genera combine + draft NFL reale + contratti (storico, poco costoso)
        if: steps.giro.outputs.leggero != '1'
        run: node scripts/build-nfl-combine-draft.mjs

      - name: Genera trade storiche per squadra
        if: steps.giro.outputs.leggero != '1'
        run: node scripts/build-nfl-trades.mjs

      - name: Genera punti reali di ogni giocatore (buchi "Unrostered" + best available)
        run: node scripts/build-nfl-player-scores.mjs ${{ steps.yrs.outputs.seasons }}

      # Deve stare DOPO il report infortuni: legge injuries_*.json per sapere
      # quali giocatore-settimana valga la pena chiedere a ESPN.
      - name: Esito reale della domenica (inactive) per chi era sul referto
        run: python scripts/espn/build_inactives.py ${{ steps.yrs.outputs.seasons }}
        continue-on-error: true   # fonte di rete: se ESPN e' giu' restano i dati precedenti

      - name: Commit dei JSON derivati (se cambiati)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Si aggiunge solo cio' che esiste davvero. `git add` su un percorso
          # che non c'e' non e' un avviso ma un errore fatale, e con `bash -e`
          # affonda tutto il passo: e' successo il 2026-08-23, quando il
          # consolidamento dei motori di Draft Grade ha cancellato
          # draft_score_v2_calib.json lasciandolo pero' scritto qui — da quel
          # giorno la Action avrebbe smesso di committare qualunque cosa,
          # senza dirlo. Con questo ciclo un file rimosso viene ignorato e il
          # resto passa lo stesso.
          for p in data/nfl/adv_*.json data/nfl/playerids.json \
                   data/model/draft_model_v1.json data/model/perf_causes_*.json \
                   data/nfl/adp_ffc_*.json \
                   data/nfl/roster_*.json data/nfl/injuries_*.json \
                   data/nfl/combine_draft.json data/nfl/team_trades.json \
                   data/nfl/unrostered_scores_*.json data/nfl/best_available_*.json \
                   data/nfl/player_status_*.json data/nfl/inactives_*.json; do
            [ -e "$p" ] && git add "$p"
          done
          # Ogni JSON porta dentro `generatedAt`, quindi risulterebbe sempre
          # cambiato anche a dati identici e la guardia qui sotto non
          # scatterebbe mai: un commit al giorno di roba uguale.
          python scripts/ci/drop_timestamp_only.py
          if git diff --staged --quiet; then
            echo "Nessuna modifica ai dati derivati."
          else
            git commit -m "chore(data): rigenera feature nflverse + modello draft [skip ci]"
            git push
          fi
