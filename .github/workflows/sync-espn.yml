name: Sync ESPN Fantasy Data

on:
  schedule:
    # Martedì 09:00 UTC (dopo Monday Night Football) — settimana in-season.
    # ESPN non ha overhead sensibile per una lega da 4 team: un run/settimana basta.
    - cron: '0 9 * * 2'
  workflow_dispatch:
    inputs:
      season:
        description: 'Stagione da sincronizzare (default: stagione ESPN corrente)'
        required: false
      draft:
        description: 'Includi anche il draft (mDraftDetail)'
        type: boolean
        default: false

jobs:
  sync-espn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync ESPN → JSON legacy
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          node scripts/espn/sync.mjs ${{ github.event.inputs.season }} ${{ github.event.inputs.draft == 'true' && '--draft' || '' }}

      - name: Upload data to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/upload-data.js

      - name: Commit JSON aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fantasy data/draft
          git diff --cached --quiet || git commit -m "chore(data): sync ESPN fantasy data [skip ci]"
          git push
