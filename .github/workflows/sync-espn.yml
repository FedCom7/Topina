name: Sync ESPN Fantasy Data

# DISATTIVATO: nessuna esecuzione automatica.
#
# I dati di lega li produce e carica su Firebase lo script Python esterno; se
# anche questo workflow scrivesse sugli stessi nodi, l'ultimo a girare
# sovrascriverebbe l'altro (è già successo il 2026-08-04: qui è finito lo
# scheletro ESPN a punteggi 0.00 al posto dei dati dello scraper).
#
# Resta solo l'avvio manuale (Actions → Run workflow), per i test. Per
# riattivare la sincronizzazione settimanale basta togliere il commento al
# blocco `schedule` qui sotto — ma prima va deciso quale dei due produttori
# è quello ufficiale.
on:
  # schedule:
  #   # Martedì 09:00 UTC (dopo Monday Night Football)
  #   - cron: '0 9 * * 2'
  workflow_dispatch:
    inputs:
      season:
        description: 'Stagione da sincronizzare (default: stagione ESPN corrente)'
        required: false
      draft:
        description: 'Includi anche il draft (mDraftDetail)'
        type: boolean
        default: false

jobs:
  sync-espn:
    runs-on: ubuntu-latest
    # Serve per il `git push` finale: senza, il token di default è in sola
    # lettura e il commit dei JSON fallisce con 403 (i dati su Firebase invece
    # vengono caricati lo stesso, perché quel passo viene prima).
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync ESPN → JSON legacy
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          node scripts/espn/sync.mjs ${{ github.event.inputs.season }} ${{ github.event.inputs.draft == 'true' && '--draft' || '' }}

      - name: Upload data to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/upload-data.js

      - name: Commit JSON aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fantasy data/draft
          git diff --cached --quiet || git commit -m "chore(data): sync ESPN fantasy data [skip ci]"
          git push
